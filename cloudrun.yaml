apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: manas-backend
  labels:
    cloud.googleapis.com/location: asia-south1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "100"
        autoscaling.knative.dev/target: "80"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/manas-prod/backend:latest
          ports:
            - name: http1
              containerPort: 8008
          resources:
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: GEMINI_MODEL
              value: "gemini-3.8-flash"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: GEMINI_API_KEY
                  key: latest
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: DATABASE_URL
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: REDIS_URL
                  key: latest
            - name: DATA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: DATA_ENCRYPTION_KEY
                  key: latest
          startupProbe:
            httpGet:
              path: /api/health
              port: 8008
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
